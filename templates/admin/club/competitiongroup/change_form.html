{% extends "admin/change_form.html" %}

{% block submit_buttons_bottom %}
{{ block.super }}
{% if original and original.pk %}
<div class="submit-row" style="margin-top: 12px;">
    <input
        type="submit"
        value="Generate World Cup fixtures"
        name="_generate_fixtures"
        style="background: #d81e3f; border-color: #d81e3f;"
        onclick="return confirm('Create round-robin group-stage matches for every team in this group? Existing pairings will be skipped.');"
    >
    <input
        type="submit"
        value="Generate knockout bracket (all groups)"
        name="_generate_knockout"
        style="background: #a8710a; border-color: #a8710a;"
        onclick="return confirm('Build the World Cup knockout from current standings of ALL active groups (top 2 each)? Existing knockout slots are skipped.');"
    >
    <p style="margin: 8px 0 0; color: var(--body-quiet-color, #999); font-size: 12px;">
        Group stage: 6 matches for 4 teams. Knockout: QF→SF→Final from every active group’s top 2.
    </p>
</div>
{% endif %}
{% endblock %}
